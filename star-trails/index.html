<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#DCEBE6">
<title>Star Trails · Little Logic Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/lab.css">
<script src="../shared/lab.js"></script>
<style>
body{--accent:var(--mint);--on-accent:var(--on-mint)}
#c{touch-action:none;display:block}
.sheet{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(35,66,59,.45)}
.sheet.on{display:flex}
.sheet-card{background:var(--raised);border-radius:var(--r-panel);padding:16px;max-width:460px;width:100%;max-height:100%;overflow:auto;font-size:14px}
.sheet-card h2{margin:0 0 8px;font-size:20px}
.sheet-card table{width:100%;border-collapse:collapse;margin:8px 0}
.sheet-card td,.sheet-card th{padding:4px;border-bottom:1px solid var(--line);text-align:center}
.sheet-card .btn{height:40px;font-size:14px;margin:3px}
.spark{font-size:20px;letter-spacing:2px;color:#3C9C7E}
</style>
</head><body>
<main class="screen">
  <header class="hdr"><a class="home-btn" href="../index.html"><span aria-hidden="true">🏠</span> Home</a><div class="ttl"><h1 id="ttl">Star Trails</h1><span class="lvl" id="lv"></span></div></header>
  <div class="caption stk" id="stk"></div>
  <div class="play" id="play"><div class="board"><canvas id="c"></canvas></div></div>
  <div class="msg" id="msg" aria-live="polite"></div>
  <div class="btns">
    <button class="btn icon" id="hb" aria-label="Hint">💡</button>
    <button class="btn icon" id="rb" aria-label="Start again">↺</button>
    <button class="btn main" id="kb">New trail</button>
  </div>
</main>
<div class="sheet" id="par"><div class="sheet-card" id="pb"></div></div>
<script>
const $=id=>document.getElementById(id),cv=$('c'),X=cv.getContext('2d');
const EM=['🚀','🪐','🌙','⭐','🛸','👽','☄️','🌍','🌞','🛰️'];
// rung: [grid n, [min,max] obstacles, target chance a random attempt succeeds, start (c=corner,a=any)]
const RG=[[3,[1,2],.5,'c'],[3,[1,3],.4,'a'],[4,[2,5],.5,'c'],[4,[2,6],.4,'a'],[4,[3,7],.33,'a'],[5,[5,11],.4,'c'],[5,[5,12],.33,'a'],[5,[6,13],.28,'a'],[5,[6,14],.25,'a'],[6,[10,20],.33,'a'],[6,[10,21],.25,'a'],[6,[11,22],.2,'a'],[7,[14,24],.15,'a'],[7,[12,22],.1,'a']];
const D=[[1,0],[-1,0],[0,1],[0,-1]],MAXR=RG.length-1,GID='trails';
let S;try{S=JSON.parse(localStorage.getItem('st1'))}catch(e){}
S=S||{rung:0,clean:0,hard:0,n:0,log:[],stk:[]};
// stickers now live in the shared sticker book; bring over any collected before
if(S.stk&&S.stk.length&&!(Lab.game('trails').stk||[]).length){Lab.game('trails').stk=S.stk.slice(-60);Lab.save()}
Lab.setupGame({id:'trails',
  demo:'trails',caption:'Visit every dot once.',
  stickers:['🚀','🪐','🌙','⭐','🛸','👽','☄️','🌍','🌞','🛰️'],
  // the grown-ups' stats moved here from the header
  extraHelp:(el,close)=>{el.innerHTML='<button class="link">Grown-ups</button>';el.firstChild.onclick=()=>{close();grownups()}}});
const save=()=>{try{localStorage.setItem('st1',JSON.stringify(S))}catch(e){}};
const sh=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const nb=(n,c)=>{const x=c%n,y=c/n|0,r=[];for(const[dx,dy]of D){const X=x+dx,Y=y+dy;if(X>=0&&Y>=0&&X<n&&Y<n)r.push(Y*n+X)}return r};
// count completions (capped), also returns first one found
function count(n,open,path,cap,budget){const seen=new Uint8Array(n*n),st=[];let left=0,cnt=0,k=0,first=null;
 for(let i=0;i<n*n;i++)if(open[i])left++;path.forEach(c=>{seen[c]=1;left--});
 const go=(c,l)=>{if(l==0){if(!cnt)first=st.slice();cnt++;return}if(cnt>=cap||++k>budget)return;
  for(const q of nb(n,c)){if(!open[q]||seen[q])continue;seen[q]=1;st.push(q);go(q,l-1);st.pop();seen[q]=0;if(cnt>=cap||k>budget)return}};
 go(path[path.length-1],left);return{cnt,over:k>budget,first}}
function reach(n,open,path){const seen=new Uint8Array(n*n),v=new Uint8Array(n*n);let tot=0,f=0;
 path.forEach(c=>seen[c]=1);for(let i=0;i<n*n;i++)if(open[i]&&!seen[i])tot++;
 const s=[path[path.length-1]];v[s[0]]=1;
 while(s.length)for(const q of nb(n,s.pop()))if(open[q]&&!seen[q]&&!v[q]){v[q]=1;f++;s.push(q)}
 return f==tot}
const isD=()=>!reach(G.n,G.open,P)||(r=>!r.over&&r.cnt==0)(count(G.n,G.open,P,1,50000));
let G,P,M,doomed,done,hint,drag,lastBad,SZ=280,lastEm,area={w:300,h:300},C={};
function trial(n,open,s){const seen=new Uint8Array(n*n);seen[s]=1;let c=s,left=-1;for(let i=0;i<n*n;i++)if(open[i])left++;
 for(;;){const o=nb(n,c).filter(q=>open[q]&&!seen[q]);if(!o.length)return left==0?1:0;c=o[Math.random()*o.length|0];seen[c]=1;left--}}
const est=(n,open,s)=>{let w=0;for(let i=0;i<250;i++)w+=trial(n,open,s);return w/250};
// random self-avoiding path of L cells
function walk(n,L,s){const seen=new Uint8Array(n*n),p=[s];seen[s]=1;let k=0;
 const go=()=>{if(p.length==L)return 1;if(++k>60000)return 0;for(const q of sh(nb(n,p[p.length-1]))){if(seen[q])continue;seen[q]=1;p.push(q);if(go())return 1;p.pop();seen[q]=0;if(k>60000)return 0}return 0};
 return go()?p:null}
// big boards (6×6 and up): draw a hidden trail first and make every other box a gap, so a solution always exists;
// keep the try whose random-attempt success rate is closest to the target
function makeByPath(r){const[n,[lo,hi],tg]=RG[r];let best=null,bd=9;
 for(let t=0;t<16&&bd>=.03;t++){const L=n*n-(lo+(Math.random()*(hi-lo+1)|0)),s=Math.random()*n*n|0,p=walk(n,L,s);if(!p)continue;
  const open=new Uint8Array(n*n);p.forEach(c=>open[c]=1);const q=est(n,open,s),d=Math.abs(q-tg);
  if(d<bd){bd=d;best={n,open,start:s,cnt:L,p:q,sig:open.join('')+s}}}
 return best}
function make(r){if(RG[r][0]>=6){const b=makeByPath(r);if(b)return b}
 const[n,[lo,hi],tg,sm]=RG[r];let best=null,bd=9;
 for(let t=0;t<14&&bd>=.04;t++){
  const s=sm=='c'?[0,n-1,n*(n-1),n*n-1][Math.random()*4|0]:Math.random()*n*n|0,idx=[...Array(n*n).keys()].filter(i=>i!=s),open=new Uint8Array(n*n).fill(1),cs=sh(idx.slice());
  for(let i=lo+(Math.random()*(hi-lo+1)|0);i>0;i--)open[cs[i]]=0;
  let p=reach(n,open,[s])?est(n,open,s):0,d=p?Math.abs(p-tg):9;
  // hill-climb: move/add/remove obstacles, keep changes that bring the random-attempt success rate closer to the target
  for(let it=0;it<120&&d>=.03;it++){const o=open.slice(),bl=idx.filter(i=>!o[i]),fr=idx.filter(i=>o[i]),m=Math.random(),pk=a=>a[Math.random()*a.length|0];
   if(m<.25&&bl.length>lo)o[pk(bl)]=1;else if(m<.5&&bl.length<hi)o[pk(fr)]=0;else if(bl.length&&fr.length){o[pk(bl)]=1;o[pk(fr)]=0}
   if(!reach(n,o,[s]))continue;const q=est(n,o,s),dq=q?Math.abs(q-tg):9;if(dq<d){open.set(o);d=dq;p=q}}
  if(p&&d<bd){bd=d;best={n,open:open.slice(),start:s,cnt:open.reduce((a,b)=>a+b,0),p,sig:open.join('')+s}}}
 return best||(r>0?make(r-1):null)}
let lastSig;
const intro='Slide the 🚀 to visit every dot once.';
function nxt(){let k=0;do G=make(S.rung);while(G.sig==lastSig&&++k<5);lastSig=G.sig;let e;do e=EM[Math.random()*EM.length|0];while(e==lastEm);G.em=lastEm=e;G.t0=Date.now();
 Lab.hideWin();Lab.setLevel(GID,S.rung);
 P=[G.start];M={moves:0,undo:0,doom:0,hint:0,bad:0,rs:0,look:[],pause:0,last:Date.now(),dAt:0,dMax:0};
 doomed=done=false;hint=null;lastBad=-1;
 $('lv').textContent='Level '+(S.rung+1)+' of '+RG.length;
 Lab.showStickers();
 fit();msg(intro,true)}
let mt;function msg(t,stay){Lab.msg(t);clearTimeout(mt);if(t&&!stay)mt=setTimeout(()=>Lab.msg(''),3500)}
// sound (follows the home page sound switch)
const PEN=[0,2,4,7,9],nf=i=>262*Math.pow(2,(PEN[i%5]+12*Math.floor(i/5))/12);
function tone(k){if(k=='step')Lab.sfx('step',P.length%15);else if(k=='undo')Lab.sfx('undo')}
// moves
function step(q){const now=Date.now();
 if(P.length>1&&q==P[P.length-2]){P.pop();M.undo++;tone('undo');if(doomed&&!isD()){doomed=false;M.look.push(M.dMax-M.dAt);msg('Nice fix!')}return 1}
 if(!G.open[q]){if(q!=lastBad){M.bad++;lastBad=q}return 0}
 if(P.includes(q))return 0;
 M.pause=Math.max(M.pause,now-M.last);M.last=now;P.push(q);M.moves++;tone('step');
 if(P.length==2&&!doomed)msg('');
 if(doomed)M.dMax=Math.max(M.dMax,P.length);
 if(P.length==G.cnt){win();return 0}
 if(!doomed&&isD()){doomed=true;M.doom++;M.dAt=P.length-1;M.dMax=P.length;msg('Oh no, stuck that way! Slide back ⬅️',true);Lab.wobble(cv)}
 return 1}
function move(e){if(done)return;const r=cv.getBoundingClientRect(),n=G.n,fx=(e.clientX-r.left)/r.width*n,fy=(e.clientY-r.top)/r.height*n,tx=Math.floor(fx),ty=Math.floor(fy);
 if(tx<0||ty<0||tx>=n||ty>=n)return;const ux=fx-tx,uy=fy-ty;if(ux<.15||ux>.85||uy<.15||uy>.85)return;
 for(let k=0;k<8&&!done;k++){const h=P[P.length-1],hx=h%n,hy=h/n|0;if(hx==tx&&hy==ty)return;const dx=tx-hx,dy=ty-hy;
  if(!step(Math.abs(dx)>=Math.abs(dy)?hy*n+hx+Math.sign(dx):(hy+Math.sign(dy))*n+hx))return}}
cv.onpointerdown=e=>{if(done)return;cv.setPointerCapture(e.pointerId);drag=1;move(e)};
cv.onpointermove=e=>{if(drag)move(e)};cv.onpointerup=cv.onpointercancel=()=>drag=0;
// adapt: two clean solves move up a level, two hard ones move down
function finish(res){if(doomed)M.look.push(M.dMax-M.dAt);const t=Date.now()-G.t0,
 clean=res=='solved'&&!M.doom&&!M.hint&&M.undo<=1,hard=res!='solved'||M.hint>=2||M.doom>=3||M.rs>=2;
 S.log.push({ts:Date.now(),r:S.rung,n:G.n,open:G.cnt,p:+(G.p||0).toFixed(2),res,t,mv:M.moves,un:M.undo,doom:M.doom,look:M.look,hint:M.hint,bad:M.bad,rs:M.rs,pause:M.pause,cl:clean?1:hard?-1:0});S.log=S.log.slice(-200);
 const warm=S.n<3;S.n++;
 if(warm){if(clean)S.rung=Math.min(S.rung+2,MAXR);else if(hard)S.rung=Math.max(S.rung-1,0)}
 else if(clean){S.hard=0;if(++S.clean>=2){S.rung=Math.min(S.rung+1,MAXR);S.clean=0}}
 else if(hard){S.clean=0;if(++S.hard>=2){S.rung=Math.max(S.rung-1,0);S.hard=0}}
 else S.clean=S.hard=0;
 if(res=='solved'){S.stk.push(G.em);S.stk=S.stk.slice(-40)}save()}
function win(){done=true;finish('solved');msg('You visited every dot!',true);
 setTimeout(()=>{Lab.win({game:GID,hero:G.em,sticker:G.em,lesson:'A trail that visits every dot once is a clever path.',next:nxt,nextLabel:'Next trail'})},900)}
$('kb').onclick=()=>{if(!done){finish('skip');nxt()}};
$('rb').onclick=()=>{if(done)return;M.rs++;if(doomed)M.look.push(M.dMax-M.dAt);P=[G.start];doomed=false;msg(intro,true)};
$('hb').onclick=()=>{if(done)return;if(doomed){msg('Slide back a bit first ⬅️');return}
 const r=count(G.n,G.open,P,1,60000);if(r.first){M.hint++;Lab.sfx('hint');hint={c:[P[P.length-1],...r.first.slice(0,3)],u:Date.now()+3000};msg('Follow the gold dashes.')}};
// draw (colours come from the shared Sea glass tokens, so dim mode applies too)
function colours(){const cs=getComputedStyle(document.documentElement),g=k=>cs.getPropertyValue(k).trim();
 C={raised:g('--raised'),text:g('--text'),given:g('--given'),
  // the trail steps through the Lab's colours, two dots per colour (a shade deeper than the tiles so it shows on light boxes)
  path:['#5BBF9F','#6FB0DE','#A38FDB','#EC92B8','#F2A766','#E9BD48']}}
function fit(){const s=Math.max(180,Math.min(area.w,area.h,520)-20)|0,d=devicePixelRatio||1;cv.style.width=cv.style.height=s+'px';cv.width=cv.height=s*d;X.setTransform(d,0,0,d,0,0);SZ=s;colours()}
function draw(now){if(!G)return;X.clearRect(0,0,SZ,SZ);const n=G.n,c=SZ/n,ct=i=>[(i%n+.5)*c,((i/n|0)+.5)*c];
 for(let i=0;i<n*n;i++){if(!G.open[i])continue;X.fillStyle=C.raised;X.beginPath();const x=i%n*c+3,y=(i/n|0)*c+3;X.roundRect?X.roundRect(x,y,c-6,c-6,Math.min(14,c*.22)):X.rect(x,y,c-6,c-6);X.fill()}
 X.globalAlpha=done?1:.08+.5*P.length/G.cnt;X.font=SZ*(done?.7:.62)+'px serif';X.textAlign='center';X.textBaseline='middle';X.fillText(G.em,SZ/2,SZ*.53);X.globalAlpha=1;
 X.lineCap=X.lineJoin='round';X.lineWidth=c*.26;if(done)X.globalAlpha=.55;
 for(let i=1;i<P.length;i++){const[a,b]=ct(P[i-1]),[x,y]=ct(P[i]);X.strokeStyle=C.path[((i-1)>>1)%C.path.length];X.beginPath();X.moveTo(a,b);X.lineTo(x,y);X.stroke()}
 X.globalAlpha=1;X.fillStyle=C.text;
 for(let i=0;i<n*n;i++)if(G.open[i]&&!P.includes(i)){const[x,y]=ct(i);X.beginPath();X.arc(x,y,c*.1,0,7);X.fill()}
 if(hint&&Date.now()<hint.u){X.setLineDash([c*.14,c*.14]);X.strokeStyle=C.given;X.lineWidth=c*.1;X.beginPath();hint.c.forEach((q,i)=>{const[x,y]=ct(q);i?X.lineTo(x,y):X.moveTo(x,y)});X.stroke();X.setLineDash([])}
 if(!done){const[hx,hy]=ct(P[P.length-1]);if(P.length==1){X.strokeStyle=C.given;X.lineWidth=4;X.beginPath();X.arc(hx,hy,c*(.3+(Lab.reduced()?0:.04*Math.sin(now/200))),0,7);X.stroke()}
  X.font=c*.55+'px serif';X.fillText('🚀',hx,hy)}}
function loop(t){draw(t);requestAnimationFrame(loop)}
// grown-up view: ⚙️ button with a sum, or long-press the title
let lp;$('ttl').onpointerdown=()=>lp=setTimeout(par,800);$('ttl').onpointerup=$('ttl').onpointerleave=()=>clearTimeout(lp);
function par(){const L=S.log.slice(-15).reverse(),a=S.log.slice(-10),av=f=>a.length?a.reduce((s,x)=>s+f(x),0)/a.length:0,lk=S.log.flatMap(x=>x.look);
 $('pb').innerHTML='<h2>Grown-up view</h2><p>Level <b>'+(S.rung+1)+'</b> of '+RG.length+' · '+S.log.length+' puzzles</p><p>Level trend (last 30): <span class="spark">'+S.log.slice(-30).map(x=>'▁▂▃▄▅▆▇█'[Math.floor(Math.min(x.r,MAXR)*7/MAXR)]).join('')+'</span></p><p>Last 10: '+(av(x=>x.t/x.open)/1000).toFixed(1)+' s per dot · '+av(x=>x.un).toFixed(1)+' undos · '+av(x=>x.doom).toFixed(1)+' dead-ends · '+av(x=>x.hint).toFixed(1)+' hints</p><p>Avg steps taken after a dead-end began: '+(lk.length?(lk.reduce((s,v)=>s+v,0)/lk.length).toFixed(1):'n/a')+' (lower = sees trouble sooner)</p><table><tr><th>Lvl</th><th>Grid</th><th>Time</th><th>Undo</th><th>Dead</th><th>Hint</th><th></th></tr>'+L.map(x=>'<tr><td>'+(x.r+1)+'</td><td>'+x.n+'×'+x.n+'</td><td>'+(x.t/1000|0)+'s</td><td>'+x.un+'</td><td>'+x.doom+'</td><td>'+x.hint+'</td><td>'+(x.res=='solved'?'✔':'skip')+'</td></tr>').join('')+'</table><p><button class="btn" id="p1">Level −</button><button class="btn" id="p2">Level +</button><button class="btn" id="p3">Export</button><button class="btn" id="p6">Back to level 1</button><button class="btn" id="p4">Reset all</button><button class="btn main" id="p5">Close</button></p>';
 $('par').classList.add('on');
 $('p1').onclick=()=>{S.rung=Math.max(0,S.rung-1);save();par()};$('p2').onclick=()=>{S.rung=Math.min(MAXR,S.rung+1);save();par()};
 $('p3').onclick=()=>{const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),k=document.createElement('a');k.href=URL.createObjectURL(b);k.download='star-trails-log.json';k.click()};
 $('p6').onclick=()=>{S.rung=0;S.clean=S.hard=0;save();par()};
 $('p4').onclick=()=>{if(confirm('Erase all Star Trails progress?')){S={rung:0,clean:0,hard:0,n:0,log:[],stk:[]};save();$('par').classList.remove('on');nxt()}};
 $('p5').onclick=()=>{$('par').classList.remove('on');nxt()}}
function grownups(){const a=10+(Math.random()*20|0),b=10+(Math.random()*20|0);if(prompt('Grown-ups only: '+a+' + '+b+' = ?')==a+b)par()}
Lab.fit($('play'),(w,h)=>{area={w,h};if(G)fit()});
nxt();requestAnimationFrame(loop);
</script>
</body></html>
