<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#DCEBE6">
<title>Lost Rovers · Little Logic Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/lab.css">
<script src="../shared/lab.js"></script>
<style>
body{--accent:var(--sky);--on-accent:var(--on-sky);--g:4px}
#g{position:relative;display:grid;grid-template-columns:repeat(var(--k),var(--s));gap:var(--g)}
#g>.x{width:var(--s);height:var(--s);display:flex;align-items:center;justify-content:center;line-height:1}
.lab{font-weight:700;color:var(--text-soft);font-size:max(13px,calc(var(--s)*.32))}
.num{font-weight:800;font-size:calc(var(--s)*.5);border-radius:var(--r-cell);transition:background .3s}
.num.ok{background:var(--mint);color:var(--on-mint)}
.num.over{box-shadow:inset 0 0 0 3px var(--nudge)}
.cell{background:var(--raised);border-radius:var(--r-cell);cursor:pointer;touch-action:none;
  font-size:calc(var(--s)*.4);font-weight:800;color:var(--text-soft);transition:background .2s}
/* parking space: the ring of boxes around a rover that no other rover may use */
.cell.zone{background:transparent;outline:2px dashed var(--line);outline-offset:-5px;cursor:default}
.cell.pv-ok{box-shadow:inset 0 0 0 3px var(--mint)}
.cell.pv-bad{box-shadow:inset 0 0 0 3px var(--nudge)}
/* a rover is one vehicle drawing over a soft blue pad that shows exactly which boxes it covers;
   the invisible .seg boxes on top only tell us which box a finger grabbed */
.rv{position:absolute;display:flex;gap:var(--g);background:rgba(143,195,230,.3);border-radius:calc(var(--s)*.3);touch-action:none;cursor:grab;
  transition:left .15s,top .15s}
.rv.v{flex-direction:column}
.rv .seg{width:var(--s);height:var(--s);position:relative;z-index:1}
.rv svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.rv.lock{box-shadow:inset 0 0 0 3px var(--given);cursor:default}
#tray{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;flex:1;--s:36px}
#tray .rv{position:relative;cursor:pointer}
#tray .rv.v{--s:22px}   /* a rover turned in the tray stands upright, smaller so the tray stays short */
#tray .rv.v.l4{--s:17px}
#hint{flex:none}
.ghost{position:fixed!important;pointer-events:none;z-index:20;opacity:.85;transition:none}
:root.dim .rv{filter:brightness(.9)}
</style>
</head><body>
<main class="screen">
  <header class="hdr"><a class="home-btn" href="../index.html"><span aria-hidden="true">🏠</span> Home</a><div class="ttl"><h1>Lost Rovers</h1><span class="lvl" id="lv"></span></div></header>
  <div class="play" id="play"><div class="board" id="bd"><div id="g"></div></div></div>
  <div class="msg" id="msg" aria-live="polite"></div>
  <div class="tray"><div id="tray"></div></div>
  <div class="btns">
    <button class="btn icon" id="prev" aria-label="Previous level">◀</button>
    <button class="btn icon" id="hint" aria-label="Hint">💡</button>
    <button class="btn icon" id="reset" aria-label="Start again">↺</button>
    <button class="btn main" id="new">New puzzle</button>
    <button class="btn icon" id="next" aria-label="Next level">▶</button>
  </div>
</main>
<script>
// n grid size, f craft lengths (1 rover, 2 rocket, 3 satellite, 4 big rocket), r whole craft shown at the start.
// Every puzzle must be solvable with one-step moves only (see kidSolve), so a bigger grid only means more to do,
// never harder thinking.
const L=[{n:3,f:[1,1],r:1},{n:4,f:[1,1,1],r:1},{n:4,f:[2,1,1],r:1},{n:5,f:[2,2,1],r:1},
 {n:5,f:[3,2,1],r:0},{n:6,f:[3,2,2,1],r:0},{n:6,f:[4,2,1,1],r:0},{n:6,f:[4,3,2,1],r:0}];
const NAME={1:'rover',2:'rocket',3:'satellite',4:'big rocket'},COLS='ABCDEF',GID='rovers',G4=4;
Lab.setupGame({id:GID,
  demo:'rovers',caption:'Drag rovers in. Tap to cross out.',
  art:()=>vehicle(2,44,'h').replace('<svg ','<svg style="width:100%;height:100%;overflow:visible" '),
  stickers:['🤖','🛰️','🪐','🚀','🛸','🌙','☄️','🔭']});
let lv=Math.min(L.length-1,Lab.game(GID).level||0),P,area={w:300,h:300},S=40;
const $=i=>document.getElementById(i),rnd=k=>Math.floor(Math.random()*k);
const R_=(c,n)=>c/n|0;

// ---------- puzzle generator ----------
function places(n,s){const o=[];for(let r=0;r<n;r++)for(let c=0;c<n;c++){
  if(c+s<=n)o.push(Array.from({length:s},(_,i)=>r*n+c+i));
  if(s>1&&r+s<=n)o.push(Array.from({length:s},(_,i)=>(r+i)*n+c));}return o}
// a placement fits if no cell is, or touches (even at a corner), another rover
function fits(n,occ,p){return p.every(c=>{const r=R_(c,n),q=c%n;
  for(let a=-1;a<2;a++)for(let b=-1;b<2;b++){const y=r+a,x=q+b;
    if(y>=0&&y<n&&x>=0&&x<n&&occ[y*n+x])return false}return true})}
function layout(n,f){for(let k=0;k<4000;k++){const occ=Array(n*n).fill(0),out=[];let ok=true;
  for(const s of f){const ps=places(n,s).filter(p=>fits(n,occ,p));if(!ps.length){ok=false;break}
    const p=ps[rnd(ps.length)];p.forEach(c=>occ[c]=1);out.push(p)}
  if(ok)return out}return null}
// Kid-level solver: works the puzzle using only one-step moves a young child can see, never "what if" guessing:
//  1. a row or column that already has all its rover boxes: the rest of it is empty
//  2. a row or column whose free boxes exactly match what it still needs: they are all rover
//  3. the parking space around a rover shown at the start is empty
//  4. a box that holds a rover has empty corner neighbours (rovers are straight and never touch)
// Returns the number of rounds it took, or -1 if it gets stuck (the puzzle would need harder thinking).
// Finishing also proves the answer is the only one.
function kidSolve(n,rc,cc,given){const st=Array(n*n).fill(-1),inb=(y,x)=>y>=0&&x>=0&&y<n&&x<n;
  given.forEach(s=>s.forEach(c=>st[c]=1));
  given.forEach(s=>s.forEach(c=>{const r=R_(c,n),q=c%n;for(let a=-1;a<2;a++)for(let b=-1;b<2;b++)if(inb(r+a,q+b)&&st[(r+a)*n+q+b]==-1)st[(r+a)*n+q+b]=0}));
  let rounds=0;
  for(;;){let ch=false;const set=(i,v)=>{if(st[i]==-1){st[i]=v;ch=true}};
    for(let i=0;i<n*n;i++)if(st[i]==1){const r=R_(i,n),q=i%n;for(const[a,b]of[[-1,-1],[-1,1],[1,-1],[1,1]])if(inb(r+a,q+b))set((r+a)*n+q+b,0)}
    for(let k=0;k<n;k++)for(const[line,need]of[[[...Array(n)].map((_,j)=>k*n+j),rc[k]],[[...Array(n)].map((_,j)=>j*n+k),cc[k]]]){
      const have=line.filter(i=>st[i]==1).length,free=line.filter(i=>st[i]==-1);
      if(have==need)free.forEach(i=>set(i,0));else if(have+free.length==need)free.forEach(i=>set(i,1))}
    if(!ch)break;rounds++}
  return st.every(v=>v!=-1)?rounds:-1}
const posOf=(n,cells)=>({r:R_(cells[0],n),c:cells[0]%n,dir:cells.length>1&&cells[1]-cells[0]!=1?'v':'h'});

function make(){
  const d=L[lv],n=d.n,f=[...d.f].sort((a,b)=>b-a);let ships,rev,rc,cc;
  // try layouts until one can be finished with one-step moves; in the rare case none turns up,
  // show one more rover at the start rather than hand out a puzzle that needs guessing
  for(let extra=0;extra<=f.length;extra++){let found=false;
    for(let t=0;t<300&&!found;t++){
      ships=layout(n,f);rc=Array(n).fill(0);cc=Array(n).fill(0);
      ships.flat().forEach(c=>{rc[R_(c,n)]++;cc[c%n]++});
      rev=[...ships].sort(()=>Math.random()-.5).slice(0,Math.min(f.length,d.r+extra));
      found=kidSolve(n,rc,cc,rev)>=0}
    if(found)break}
  // the fleet: one entry per rover; pos = where the child parked it (null = in the tray)
  const fleet=f.map((len,k)=>({k,len,pos:null,lock:false}));
  rev.forEach(cells=>{const it=fleet.find(x=>x.len==cells.length&&!x.lock);it.pos=posOf(n,cells);it.lock=true});
  P={n,f,ships,rc,cc,fleet,marks:new Set(),done:false};
  Lab.setLevel(GID,lv);Lab.hideWin();Lab.puzzleStart(GID);
  $('lv').textContent='Level '+(lv+1)+' of '+L.length;
  $('prev').disabled=lv==0;$('next').disabled=lv==L.length-1;
  Lab.msg(intro());draw()}
const intro=()=>lv<2?'Drag rovers in. Numbers count their boxes.':'Tap a rover to turn it. Rovers need space.';

// ---------- rules for the child's moves ----------
const cellsOf=(len,p)=>Array.from({length:len},(_,i)=>p.dir=='h'?p.r*P.n+p.c+i:(p.r+i)*P.n+p.c);
const inside=(len,p)=>p.r>=0&&p.c>=0&&(p.dir=='h'?p.c+len<=P.n&&p.r<P.n:p.r+len<=P.n&&p.c<P.n);
function taken(except){const occ=new Set();P.fleet.forEach(it=>{if(it.pos&&it!==except)cellsOf(it.len,it.pos).forEach(c=>occ.add(c))});return occ}
function zoneOf(occ){const n=P.n,z=new Set();occ.forEach(c=>{const r=R_(c,n),q=c%n;
  for(let a=-1;a<2;a++)for(let b=-1;b<2;b++){const y=r+a,x=q+b;if(y>=0&&x>=0&&y<n&&x<n&&!occ.has(y*n+x))z.add(y*n+x)}});return z}
// can this rover park here? not off the grid, not on or beside another rover
function canPark(it,p){if(!inside(it.len,p))return false;const occ=taken(it),z=zoneOf(occ);
  return cellsOf(it.len,p).every(c=>!occ.has(c)&&!z.has(c))}
function park(it,p){it.pos=p;cellsOf(it.len,p).forEach(c=>P.marks.delete(c))}

// ---------- logic tracker: which rule made a step certain? ----------
// What the child can see right now: rover boxes, and empty boxes (their ✖ marks plus every parking space).
function seen(except){const rov=taken(except),emp=new Set([...P.marks,...zoneOf(rov)]);return{rov,emp}}
const lineCells=(k,row)=>[...Array(P.n)].map((_,j)=>row?k*P.n+j:j*P.n+k);
// the simple rule (if any) that decides box i is empty / is a rover, from what the child can see
function whyEmpty(i,s){const r=R_(i,P.n),c=i%P.n;
  if(P.rc[r]==0||P.cc[c]==0)return'zero';
  for(const[line,need]of[[lineCells(r,true),P.rc[r]],[lineCells(c,false),P.cc[c]]])if(line.filter(x=>s.rov.has(x)).length>=need)return'done';
  return null}
function whyRover(i,s){const r=R_(i,P.n),c=i%P.n;
  for(const[line,need]of[[lineCells(r,true),P.rc[r]],[lineCells(c,false),P.cc[c]]]){
    const have=line.filter(x=>s.rov.has(x)).length,free=line.filter(x=>!s.rov.has(x)&&!s.emp.has(x)).length;
    if(need>have&&need-have==free)return'full'}
  return null}
const solSet=()=>new Set(P.ships.flat());
const lineName=i=>'row '+(R_(i,P.n)+1);
// a small picture of the board for the grown-ups report; `hi` boxes get a gold ring
function snap(hi=[],mintClue){const n=P.n,s=seen(),cells=[['','gap']];
  P.cc.forEach((v,c)=>cells.push([String(v),'clue'+(mintClue&&mintClue[0]=='c'&&mintClue[1]==c?' mint':'')]));
  for(let r=0;r<n;r++){cells.push([String(P.rc[r]),'clue'+(mintClue&&mintClue[0]=='r'&&mintClue[1]==r?' mint':'')]);
    for(let c=0;c<n;c++){const i=r*n+c;cells.push([P.marks.has(i)?'✖':'',(s.rov.has(i)?'rov':P.marks.has(i)?'x':s.emp.has(i)?'zone':'')+(hi.includes(i)?' hl':'')])}}
  return{cols:n+1,cells}}
// a ✖ mark is about to be added on box i
function trackMark(i){const s=seen(),sol=solSet(),r=R_(i,P.n),c=i%P.n,box=COLS[c]+(r+1);
  if(sol.has(i)){const w=whyRover(i,s);if(w)Lab.logic(w,'missed');return}
  const w=whyEmpty(i,s);if(!w)return;
  P.marks.add(i);
  const zeroLine=P.rc[r]==0?['r',r]:P.cc[c]==0?['c',c]:null;
  Lab.logic(w,'used',{snap:snap([i],w=='zero'?zeroLine:null),
    cap:w=='zero'?(zeroLine[0]=='r'?'Row '+(r+1):'Column '+COLS[c])+' said 0, so they crossed out '+box+'.':'That line already had all its rover boxes, so they crossed out '+box+'.'});
  P.marks.delete(i)}
// rover `it` is about to be parked at p (from the tray, a move, or a turn)
function trackPark(it,p){const s=seen(it),sol=solSet(),cs=cellsOf(it.len,p),ok=cs.every(x=>sol.has(x));
  if(!ok){const rules=new Set(cs.filter(x=>!sol.has(x)).map(x=>whyEmpty(x,s)).filter(Boolean));rules.forEach(w=>Lab.logic(w,'missed'));return}
  const full=cs.find(x=>whyRover(x,s)=='full');
  const shown=()=>{const saved=it.pos;it.pos=p;const sn=snap(cs);it.pos=saved;return sn};
  if(full!=null)Lab.logic('full','used',{snap:shown(),cap:'The '+lineName(full)+' clue matched its free boxes, so they parked the '+NAME[it.len]+' there.'});
  // the parking spaces of other rovers narrowed this line down: the no-touch rule helped
  const lines=new Set();cs.forEach(x=>{lineCells(R_(x,P.n),true).forEach(y=>lines.add(y));lineCells(x%P.n,false).forEach(y=>lines.add(y))});
  if([...lines].some(y=>zoneOf(s.rov).has(y)))Lab.logic('zone','used',{snap:shown(),cap:'They parked the '+NAME[it.len]+' clear of another rover\'s parking space.'})}
// where a parked rover goes when tapped to turn: first around its front box (as before); if that has no room,
// around the box that was tapped; failing that, the nearest spot pointing the new way that still touches that box.
function turnSpot(it,tapped){const n=P.n,old=it.pos,nd=old.dir=='h'?'v':'h',X=cellsOf(it.len,old)[Math.min(tapped,it.len-1)],xr=R_(X,n),xc=X%n,best=[];
  for(let r=0;r<n;r++)for(let c=0;c<n;c++){const p={r,c,dir:nd};if(!canPark(it,p))continue;
    const cs=cellsOf(it.len,p),dist=Math.min(...cs.map(q=>Math.abs(R_(q,n)-xr)+Math.abs(q%n-xc)));if(dist>1)continue;
    best.push({p,front:r==old.r&&c==old.c?0:1,dist,off:cs.includes(X)?Math.abs(cs.indexOf(X)-tapped):9})}
  best.sort((a,b)=>a.front-b.front||a.dist-b.dist||a.off-b.off);
  return best.length?best[0].p:null}

// ---------- drawing ----------
function size(){if(!P)return;const k=P.n+2;
  S=Math.max(24,Math.min(96,Math.floor((Math.min(area.w,area.h)-20-G4*(k-1))/k)));
  $('g').style.setProperty('--s',S+'px');$('g').style.setProperty('--k',k)}
// ---------- the space fleet: rover 1 box, rocket 2, satellite 3, big rocket 4 ----------
// Each craft is drawn flat and points along its length, front at the LEFT. A turned craft is the same
// drawing rotated a quarter turn, so its front sits on the top box (a rocket stood up points to the sky).
const INK='#0E3550',SKY='#8FC3E6',DEEP='#5E9BCB',HULL='#F4F7FA',GLASS='#D7F2E8',SUN='#F3CF6B',LAV='#B9A6E3',PINK='#F2A7C6',APRICOT='#F5B97F',HUB='#E3F1FB';
function vehicle(len,u,dir){
  const g=G4,W=len*u+(len-1)*g,cx=i=>i*(u+g)+u/2,c=u/2,sw=Math.max(1,u*.04),f=v=>+v.toFixed(1);
  const st=o=>o?' stroke="'+INK+'" stroke-width="'+f(sw*o)+'" stroke-linejoin="round"':'';
  const R=(x,y,w,h,r,fill,o=1)=>'<rect x="'+f(x)+'" y="'+f(y)+'" width="'+f(w)+'" height="'+f(h)+'" rx="'+f(r)+'" fill="'+fill+'"'+st(o)+'/>';
  const C=(x,y,r,fill,o=1)=>'<circle cx="'+f(x)+'" cy="'+f(y)+'" r="'+f(r)+'" fill="'+fill+'"'+st(o)+'/>';
  const Pg=(pts,fill,o=1)=>'<polygon points="'+pts.map(p=>p.map(f).join(',')).join(' ')+'" fill="'+fill+'"'+st(o)+'/>';
  const Pa=(d,fill,o=1)=>'<path d="'+d+'" fill="'+fill+'"'+st(o)+'/>';
  const Ln=(x1,y1,x2,y2,w=1,col=INK)=>'<line x1="'+f(x1)+'" y1="'+f(y1)+'" x2="'+f(x2)+'" y2="'+f(y2)+'" stroke="'+col+'" stroke-width="'+f(sw*w)+'" stroke-linecap="round"/>';
  let s='';
  if(len==1){
    // a cute little rover: round body, a screen face with a smile, an antenna and two chunky wheels
    s+=Ln(u*.62,u*.2,u*.72,u*.06,1.2)+C(u*.72,u*.06,u*.06,SUN);
    s+=R(u*.12,u*.2,u*.76,u*.5,u*.2,SKY);
    s+=R(u*.22,u*.28,u*.5,u*.28,u*.1,GLASS,.8)+C(u*.38,u*.4,u*.045,INK,0)+C(u*.56,u*.4,u*.045,INK,0)+
       Pa('M'+f(u*.4)+' '+f(u*.48)+' Q'+f(u*.47)+' '+f(u*.53)+' '+f(u*.54)+' '+f(u*.48),'none',.7);
    s+=C(u*.13,u*.56,u*.05,SUN,.6);                                   // headlight
    s+=[u*.3,u*.7].map(x=>C(x,u*.78,u*.15,INK,0)+C(x,u*.78,u*.065,HUB,0)).join('');
  }else if(len==3){
    // satellite: blue solar panels on both ends, a gold body with a dish in the middle
    s+=Ln(cx(0),c,cx(2),c,1.6);
    [0,2].forEach(i=>{const x=cx(i);s+=R(x-u*.42,c-u*.36,u*.84,u*.72,u*.05,DEEP);
      for(let k=1;k<4;k++)s+=Ln(x-u*.42+k*u*.21,c-u*.36,x-u*.42+k*u*.21,c+u*.36,.5,'#BFE0F5');s+=Ln(x-u*.42,c,x+u*.42,c,.5,'#BFE0F5')});
    const m=cx(1);s+=R(m-u*.32,c-u*.32,u*.64,u*.64,u*.08,SUN)+Ln(m-u*.24,c-u*.13,m+u*.24,c-u*.13,.5,'#C9A13C')+Ln(m-u*.24,c+u*.13,m+u*.24,c+u*.13,.5,'#C9A13C');
    s+=C(m,c,u*.21,HULL)+C(m,c,u*.1,LAV,.8)+Ln(m,c,m+u*.08,c-u*.38,1)+C(m+u*.08,c-u*.4,u*.055,PINK,.8);
  }else{
    // rocket (2 boxes) or big rocket (4): pink nose at the front, round windows, blue fins and a little flame
    const b0=W*.2,b1=W*.86,h=u*.26;
    s+=Pg([[W*.88,c-h*.5],[W*.995,c-h*.25],[W*.97,c],[W*.995,c+h*.25],[W*.88,c+h*.5]],APRICOT,.6)+Pg([[W*.88,c-h*.28],[W*.955,c],[W*.88,c+h*.28]],SUN,0);
    s+=Pg([[W*.62,c-h],[W*.8,c-h],[W*.9,c-u*.47],[W*.76,c-u*.45]],SKY)+Pg([[W*.62,c+h],[W*.8,c+h],[W*.9,c+u*.47],[W*.76,c+u*.45]],SKY);
    s+=R(b0,c-h,b1-b0,h*2,h*.6,HULL);
    s+=Pa('M'+f(b0+2)+' '+f(c-h)+' C'+f(W*.09)+' '+f(c-h)+' '+f(W*.02)+' '+f(c-h*.35)+' '+f(W*.015)+' '+f(c)+' C'+f(W*.02)+' '+f(c+h*.35)+' '+f(W*.09)+' '+f(c+h)+' '+f(b0+2)+' '+f(c+h)+' Z',PINK);
    s+=R(W*.5,c-h,W*.05,h*2,0,LAV,.6);
    (len>=4?[W*.31,W*.42]:[W*.36]).forEach(x=>s+=C(x,c,u*.12,GLASS,1.2)+C(x-u*.03,c-u*.03,u*.03,'#fff',0));
    if(len>=4)s+=R(W*.66,c-h,W*.03,h*2,0,PINK,.6);
  }
  const inner=dir=='v'?'<g transform="translate('+f(u)+',0) rotate(90)">'+s+'</g>':s;
  return '<svg viewBox="0 0 '+f(dir=='v'?u:W)+' '+f(dir=='v'?W:u)+'" aria-hidden="true">'+inner+'</svg>'}
function roverHTML(it,cls,extra){
  const segs=Array.from({length:it.len},()=>'<span class="seg"></span>').join('');
  const dir=cls=='tp'?(it.trayDir||'h'):(it.pos?it.pos.dir:'h');
  const u=cls=='tp'?(dir=='h'?36:it.len==4?17:22):S;
  return '<div class="rv '+dir+' l'+it.len+(it.lock?' lock':'')+'" data-k="'+it.k+'" '+(extra||'')+' role="button" aria-label="'+NAME[it.len]+', '+it.len+' long">'+vehicle(it.len,u,dir)+segs+'</div>'}
function cur(){const{n}=P,r=Array(n).fill(0),c=Array(n).fill(0);taken().forEach(i=>{r[R_(i,n)]++;c[i%n]++});return{r,c}}
function draw(){
  const{n,rc,cc}=P,k=cur(),occ=taken(),z=zoneOf(occ);size();
  const st=(have,need)=>have==need?'ok':have>need?'over':'';
  let h='<div class="x"></div><div class="x"></div>'+[...Array(n)].map((_,c)=>'<div class="x lab">'+COLS[c]+'</div>').join('');
  h+='<div class="x"></div><div class="x"></div>'+cc.map((v,c)=>'<div class="x num '+st(k.c[c],v)+'">'+v+'</div>').join('');
  for(let r=0;r<n;r++){
    h+='<div class="x lab">'+(r+1)+'</div><div class="x num '+st(k.r[r],rc[r])+'">'+rc[r]+'</div>';
    for(let c=0;c<n;c++){const i=r*n+c;
      h+='<div class="x cell'+(z.has(i)?' zone':'')+'" data-i="'+i+'" aria-label="'+COLS[c]+(r+1)+'">'+(P.marks.has(i)&&!z.has(i)&&!occ.has(i)?'✖':'')+'</div>'}}
  // parked rovers sit on top of the boxes they cover
  P.fleet.forEach(it=>{if(!it.pos)return;const x=(it.pos.c+2)*(S+G4),y=(it.pos.r+2)*(S+G4);
    h+=roverHTML(it,'',' style="left:'+x+'px;top:'+y+'px"')});
  $('g').innerHTML=h;
  const left=P.fleet.filter(it=>!it.pos);
  $('tray').innerHTML=left.length?left.map(it=>roverHTML(it,'tp','data-tray="1"')).join(''):'<span class="empty">All rovers are parked</span>'}

// ---------- touch: drag rovers, tap to turn, tap a box for ✖ ----------
let D=null,ghost=null;
function hoverCell(x,y){const b=$('g').getBoundingClientRect(),step=S+G4;
  return{r:Math.floor((y-b.top)/step)-2,c:Math.floor((x-b.left)/step)-2}}
function target(e){const h=hoverCell(e.clientX,e.clientY);
  return{p:{r:h.r-(D.dir=='v'?D.grab:0),c:h.c-(D.dir=='h'?D.grab:0),dir:D.dir},onGrid:h.r>=0&&h.c>=0&&h.r<P.n&&h.c<P.n}}
function preview(t){document.querySelectorAll('.pv-ok,.pv-bad').forEach(el=>el.classList.remove('pv-ok','pv-bad'));
  if(!t||!t.onGrid)return;const it=P.fleet[D.k],ok=canPark(it,t.p);
  for(let i=0;i<it.len;i++){const r=t.p.r+(t.p.dir=='v'?i:0),c=t.p.c+(t.p.dir=='h'?i:0);
    if(r<0||c<0||r>=P.n||c>=P.n)continue;const el=document.querySelector('.cell[data-i="'+(r*P.n+c)+'"]');if(el)el.classList.add(ok?'pv-ok':'pv-bad')}}
addEventListener('pointerdown',e=>{
  if(!P||P.done||!e.target.closest)return;
  const rv=e.target.closest('.rv'),cell=e.target.closest('.cell');
  if(rv){const it=P.fleet[+rv.dataset.k];if(it.lock){Lab.msg('That rover was found for you.');return}
    const segs=[...rv.querySelectorAll('.seg')],grab=Math.max(0,segs.indexOf(e.target.closest('.seg')));
    D={k:it.k,fromTray:!!rv.dataset.tray,dir:rv.dataset.tray?(it.trayDir||'h'):it.pos.dir,grab,x:e.clientX,y:e.clientY,moved:false};e.preventDefault()}
  else if(cell){D={cell:+cell.dataset.i,x:e.clientX,y:e.clientY,moved:false};e.preventDefault()}});
addEventListener('pointermove',e=>{
  if(!D||D.k==null)return;
  if(!D.moved&&Math.hypot(e.clientX-D.x,e.clientY-D.y)<8)return;
  D.moved=true;const it=P.fleet[D.k];
  if(!ghost){const w=document.createElement('div');w.innerHTML=roverHTML({...it,pos:{dir:D.dir}},'');ghost=w.firstChild;ghost.classList.add('ghost');
    ghost.style.setProperty('--s',S+'px');document.body.appendChild(ghost)}
  const off=D.grab*(S+G4)+S/2;
  ghost.style.left=(e.clientX-(D.dir=='h'?off:S/2))+'px';ghost.style.top=(e.clientY-(D.dir=='v'?off:S/2))+'px';
  preview(target(e))});
addEventListener('pointerup',e=>{
  if(!D)return;const d=D;D=null;if(ghost){ghost.remove();ghost=null}preview(null);
  if(d.cell!=null){if(d.moved)return;const occ=taken();if(occ.has(d.cell)||zoneOf(occ).has(d.cell))return;
    if(!P.marks.has(d.cell))trackMark(d.cell);
    P.marks.has(d.cell)?P.marks.delete(d.cell):P.marks.add(d.cell);Lab.sfx('mark');draw();return}
  const it=P.fleet[d.k];
  if(!d.moved){
    if(it.len==1){if(d.fromTray)Lab.msg('Drag the rover onto the grid.');return}
    if(d.fromTray){   // turn it in the tray, so it drops onto the grid the way it now points
      it.trayDir=(it.trayDir||'h')=='h'?'v':'h';Lab.sfx('turn');draw();
      Lab.msg('Now it goes '+(it.trayDir=='v'?'down':'across')+'. Drag it in.');return}
    const p=turnSpot(it,d.grab);
    if(p){trackPark(it,p);park(it,p);Lab.sfx('turn');Lab.msg('');draw();autoCheck()}
    else{Lab.msg('No room to turn it here.');Lab.wobble(document.querySelector('#g .rv[data-k="'+it.k+'"]'))}
    return}
  D={...d};const t=target(e);D=null;
  if(!t.onGrid){if(!d.fromTray){it.trayDir=it.pos.dir;it.pos=null;Lab.msg('');draw()}return}   // dropped off the grid: back to the tray, still pointing the same way
  if(canPark(it,t.p)){trackPark(it,t.p);park(it,t.p);Lab.sfx('place');Lab.msg('');draw();autoCheck()}
  else{if(inside(it.len,t.p))Lab.logic('zone','missed');   // tried to park on or beside another rover
    Lab.msg(inside(it.len,t.p)?'No room there. Rovers need space around them.':'That spot is off the grid.');Lab.wobble($('bd'))}});
addEventListener('pointercancel',()=>{if(ghost){ghost.remove();ghost=null}D=null;preview(null)});

// ---------- buttons ----------
function problem(){const{n,rc,cc}=P,k=cur();
  const inTray=P.fleet.filter(it=>!it.pos).length;
  for(let r=0;r<n;r++)if(k.r[r]>rc[r])return'Row '+(r+1)+' has '+(k.r[r]-rc[r])+' too many.';
  for(let c=0;c<n;c++)if(k.c[c]>cc[c])return'Column '+COLS[c]+' has '+(k.c[c]-cc[c])+' too many.';
  if(inTray)return inTray==1?'One rover is still in the tray.':inTray+' rovers are still in the tray.';
  for(let r=0;r<n;r++)if(k.r[r]<rc[r])return'Row '+(r+1)+' needs '+(rc[r]-k.r[r])+' more.';
  for(let c=0;c<n;c++)if(k.c[c]<cc[c])return'Column '+COLS[c]+' needs '+(cc[c]-k.c[c])+' more.';
  return''}
// no Check button: the game wins by itself as soon as every rover is right, like the other games.
// When every rover is parked but something is off, it says gently what to look at.
function autoCheck(){if(P.done)return;const e=problem();
  if(!e){P.done=true;Lab.msg('All rovers found!');setTimeout(celebrate,800);return}
  if(!P.fleet.some(it=>!it.pos)){Lab.msg('Nearly! '+e);Lab.wobble($('bd'))}}
function celebrate(){
  const last=lv==L.length-1;
  Lab.win({game:GID,hero:'🤖',title:last?'You finished all the levels!':null,
    lesson:'Row and column numbers point to every rover.',
    next:last?null:()=>{lv++;make()},again:make})}
// hint: park one rover where it really belongs, and send back any rover in its way
$('hint').onclick=()=>{if(P.done)return;const n=P.n;
  const locked=new Set();P.fleet.forEach(it=>{if(it.lock)cellsOf(it.len,it.pos).forEach(c=>locked.add(c))});
  const ship=P.ships.find(s=>!s.every(c=>locked.has(c)));
  if(!ship){Lab.msg('Every rover is already showing.');return}
  const p=posOf(n,ship),same=it=>it.pos&&it.pos.r==p.r&&it.pos.c==p.c&&(it.len==1||it.pos.dir==p.dir);
  // tracker: a hint, and the rule that would have found this rover (if a simple one did)
  Lab.hintUsed();{const sv=seen(),w=ship.map(x=>whyRover(x,sv)).find(Boolean);if(w)Lab.logic(w,'hint')}
  const it=P.fleet.find(x=>!x.lock&&x.len==ship.length&&same(x))||P.fleet.find(x=>!x.lock&&x.len==ship.length&&!x.pos)||P.fleet.find(x=>!x.lock&&x.len==ship.length);
  it.pos=null;it.lock=true;
  P.fleet.forEach(o=>{if(o!==it&&o.pos&&!o.lock&&!canParkWith(o,ship))o.pos=null});
  Lab.sfx('hint');park(it,p);draw();Lab.msg('💡 A '+NAME[ship.length]+' is parked at '+COLS[p.c]+(p.r+1)+'.');autoCheck()};
function canParkWith(o,ship){const n=P.n,cs=cellsOf(o.len,o.pos);
  return cs.every(c=>ship.every(s=>Math.abs(R_(s,n)-R_(c,n))>1||Math.abs(s%n-c%n)>1))}
$('reset').onclick=()=>{if(P.done)return;P.fleet.forEach(it=>{if(!it.lock)it.pos=null});P.marks.clear();draw();Lab.msg(intro())};
$('prev').onclick=()=>{lv=Math.max(0,lv-1);make()};
$('next').onclick=()=>{lv=Math.min(L.length-1,lv+1);make()};
$('new').onclick=make;
Lab.fit($('play'),(w,h)=>{area={w,h};if(P)draw()});
make();
</script>
</body></html>
